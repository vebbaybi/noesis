name: Noesis CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noesis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NOESIS_ENV: test
  NOESIS_ENABLE_DISCORD: "false"
  NOESIS_ENABLE_X: "false"
  NOESIS_ENABLE_LIVE_AGENT: "false"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  base-install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: noesis/pyproject.toml
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: python -c "from noesis_agent.runtime.container import ServiceContainer; print(ServiceContainer().is_healthy()['intelligence_stack'])"

  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: noesis
    env:
      NOESIS_DATA_DIR: ${{ runner.temp }}/noesis-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: noesis/pyproject.toml
      - name: Install Noesis and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify dependency consistency and workspace import
        run: |
          python -m pip check
          python -c "import noesis_agent; print(noesis_agent.__file__)"
      - name: Compile source
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest -p pytest_asyncio.plugin -q
      - name: Run architecture rules separately
        run: python -m pytest -p pytest_asyncio.plugin -q tests/test_architecture_boundaries.py tests/test_foundation_architecture.py
      - name: Intelligence stack quality
        if: matrix.python-version == '3.12'
        run: |
          ruff check src/noesis_agent/domain/contracts/intelligence.py src/noesis_agent/domain/contracts/components.py src/noesis_agent/domain/contracts/indexing.py src/noesis_agent/application/intelligence src/noesis_agent/application/components.py src/noesis_agent/application/index_recovery.py src/noesis_agent/cognition/tools.py src/noesis_agent/capabilities/moderation/pipeline.py src/noesis_agent/integrations/llm/hybrid.py src/noesis_agent/infrastructure/coordination src/noesis_agent/infrastructure/retrieval tests/test_intelligence_stack.py
          mypy --ignore-missing-imports src/noesis_agent/domain/contracts/intelligence.py src/noesis_agent/domain/contracts/components.py src/noesis_agent/domain/contracts/indexing.py src/noesis_agent/application/intelligence src/noesis_agent/application/components.py src/noesis_agent/application/index_recovery.py src/noesis_agent/cognition/tools.py src/noesis_agent/capabilities/moderation/pipeline.py src/noesis_agent/integrations/llm/hybrid.py src/noesis_agent/infrastructure/coordination src/noesis_agent/infrastructure/retrieval

  intelligence-extras:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: noesis/pyproject.toml
      - run: python -m pip install -e ".[dev,rag,local-llm,coordination]"
      - run: python -m pip check
      - run: python -c "import fastembed, litellm, qdrant_client, redis"
      - run: python -m pytest -p pytest_asyncio.plugin -q tests/test_intelligence_stack.py tests/test_index_recovery.py
      - name: Smoke-test API health endpoints
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from noesis_agent.interfaces.api.app import app
          client = TestClient(app)
          assert client.get("/live").status_code == 200
          assert client.get("/ready").status_code == 200
          PY

  compose-cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noesis
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build noesis
      - run: docker compose up -d qdrant redis noesis
      - name: Wait for liveness and readiness
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/live >/dev/null && curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true
      - name: Validate service round trips
        run: |
          docker compose exec -T redis redis-cli SET noesis:ci:roundtrip ok EX 10
          test "$(docker compose exec -T redis redis-cli --raw GET noesis:ci:roundtrip)" = "ok"
          docker compose exec -T noesis python -c "import asyncio; from qdrant_client import AsyncQdrantClient; asyncio.run(AsyncQdrantClient(url='http://qdrant:6333').get_collections())"
      - name: Save sanitized failure logs
        if: failure()
        run: docker compose logs --no-color | sed -E 's/(token|key|secret)=[^ ]+/\1=[REDACTED]/gi' > compose-failure.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-failure-logs
          path: noesis/compose-failure.log
          retention-days: 7
      - if: always()
        run: docker compose down --volumes --remove-orphans

  package:
    name: Build release artifact
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: python -m pip install --upgrade build && python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: noesis-agent-${{ github.sha }}
          path: noesis/dist/*
          if-no-files-found: error
          retention-days: 30
