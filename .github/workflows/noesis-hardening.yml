name: Noesis hardening validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: noesis}
    env:
      NOESIS_ENV: test
      NOESIS_ENABLE_DISCORD: "false"
      NOESIS_ENABLE_X: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: noesis/pyproject.toml}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m compileall -q src
      - run: python -m pytest -p pytest_asyncio.plugin -q
  compose-cpu:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: noesis}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build noesis
      - run: docker compose up -d qdrant redis noesis
      - name: Validate readiness and service round trips
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/live && curl --fail --silent http://127.0.0.1:8000/ready && break
            sleep 3
          done
          curl --fail http://127.0.0.1:8000/ready
          docker compose exec -T redis redis-cli SET noesis:ci:roundtrip ok EX 10
          test "$(docker compose exec -T redis redis-cli --raw GET noesis:ci:roundtrip)" = "ok"
          docker compose exec -T noesis python -c "import asyncio; from qdrant_client import AsyncQdrantClient; asyncio.run(AsyncQdrantClient(url='http://qdrant:6333').get_collections())"
      - name: Save sanitized logs
        if: failure()
        run: docker compose logs --no-color | sed -E 's/(token|key|secret)=[^ ]+/\1=[REDACTED]/gi' > compose-failure.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: compose-failure-logs, path: noesis/compose-failure.log, retention-days: 7}
      - if: always()
        run: docker compose down --volumes --remove-orphans
