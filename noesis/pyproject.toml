[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis-agent"
version = "0.1.0"
description = "NOESIS multi-platform podcast and spaces agent for X and Discord"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "openai>=1.40.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "py-cord[voice]>=2.7.0,<3.0.0",
  "tweepy>=4.14.0,<5.0.0",
  "tenacity>=9.0.0,<10.0.0",
  "networkx>=3.2.1",
  "tldextract>=5.1.2",
  "psutil>=5.9.8",
  "feedgen>=1.0.0",
  "numpy>=1.26.4",
  "scikit-learn>=1.5,<2.0",
  "rapidfuzz>=3.9,<4.0",
  "PyYAML>=6.0,<7.0"
]

[project.optional-dependencies]
audio = [
  "faster-whisper>=1.0.3",
  "numpy>=1.26.4",
  "pyannote.audio>=3.1.1",
  "noisereduce>=3.0.3,<4.0",
  "soundfile>=0.12.1,<1.0",
  "sounddevice>=0.4.6",
  "webrtcvad>=2.0.10"
]
dev = [
  "build>=1.2,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "httpx2>=2.5,<3.0",
  "mypy>=1.11,<2.0",
  "ruff>=0.6,<1.0"
]
discord = ["py-cord[voice]>=2.7.0,<3.0.0"]
rag = [
  "fastembed>=0.7,<1.0",
  "qdrant-client>=1.14,<2.0"
]
moderation = ["detoxify>=0.5.2,<1.0"]
local-llm = ["litellm>=1.74.15,<1.75"]
coordination = ["redis>=5.2,<9.0"]
observability = ["prometheus-client>=0.21,<1.0"]
full = [
  "litellm>=1.74.15,<1.75",
  "fastembed>=0.7,<1.0",
  "qdrant-client>=1.14,<2.0",
  "detoxify>=0.5.2,<1.0",
  "redis>=5.2,<9.0",
  "prometheus-client>=0.21,<1.0",
  "faster-whisper>=1.0.3",
  "numpy>=1.26.4",
  "pyannote.audio>=3.1.1",
  "noisereduce>=3.0.3,<4.0",
  "soundfile>=0.12.1,<1.0",
  "sounddevice>=0.4.6",
  "webrtcvad>=2.0.10"
]
gpu = [
  "faster-whisper>=1.0.3",
  "detoxify>=0.5.2,<1.0",
  "pyannote.audio>=3.1.1"
]

[project.scripts]
noesis = "noesis_agent.runtime.bootstrap:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"noesis_agent.interfaces.api" = ["operator.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
