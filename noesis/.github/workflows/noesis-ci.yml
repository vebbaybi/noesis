name: Noesis CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noesis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      NOESIS_ENV: test
      NOESIS_ENABLE_DISCORD: "false"
      NOESIS_ENABLE_X: "false"
      NOESIS_ENABLE_LIVE_AGENT: "false"
      NOESIS_DATA_DIR: ${{ runner.temp }}/noesis-data
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Noesis and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test API health endpoint
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from noesis_agent.api.app import app
          response = TestClient(app).get("/health")
          assert response.status_code == 200, response.text
          assert response.json()["status"] == "ok", response.json()
          PY
  package:
    name: Build release artifact
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: python -m pip install --upgrade build && python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: noesis-agent-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
