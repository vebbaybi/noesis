name: Noesis CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify environment
        run: |
          python -m pip check
          python -c "import noesis_agent; print(noesis_agent.__file__)"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -p pytest_asyncio.plugin -q
      - name: Architecture rules
        run: python -m pytest -p pytest_asyncio.plugin -q tests/test_architecture_boundaries.py tests/test_foundation_architecture.py
